server:
  port: 18080

spring:
  profiles:
    active: offline
    
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/database/autowork;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: 
    
  h2:
    console:
      enabled: true
      path: /h2-console
      
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nolog.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 缓存配置
spring.cache:
  type: caffeine
  caffeine:
    spec: maximumSize=1000,expireAfterWrite=30m

# 应用配置
app:
  data-dir: ./data
  portable-mode: false
  max-file-size: 100MB
  cache:
    maximum-size: 1000
    expire-after-write: 30m

# 文件上传配置
spring.servlet.multipart:
  max-file-size: 100MB
  max-request-size: 100MB

# 日志配置
logging:
  level:
    com.soukon: INFO
    org.springframework: WARN
  file:
    name: ./logs/autowork-offline.log
  pattern:
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'